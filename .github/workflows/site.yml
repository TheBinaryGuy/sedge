name: Site

# Deploys sedge.sh (apps/site, with the docs from docs/) when what it shows changes on main.
on:
    push:
        branches: [main]
        paths:
            - apps/site/**
            - docs/**
            - scripts/install.sh
            - packages/core/src/logo.ts
            - bun.lock
            - .github/workflows/site.yml
    workflow_dispatch:

concurrency:
    group: site
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        env:
            # A Cloudflare API token with "Edit Cloudflare Workers", and the account it belongs to.
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - name: Build
              working-directory: apps/site
              run: bun run build
            - name: Deploy
              if: env.CLOUDFLARE_API_TOKEN != ''
              working-directory: apps/site
              run: bunx wrangler deploy
            - name: Not deployed
              if: env.CLOUDFLARE_API_TOKEN == ''
              run: echo "::warning::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy sedge.sh."
