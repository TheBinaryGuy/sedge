name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        # Windows is new: it reports, but doesn't block, until it has passed for a while.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - run: bun install --frozen-lockfile
            - run: bun run format:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test
            # Compiles this runner's binary and checks that it starts.
            - run: bun scripts/build.ts
            - run: ./dist/npm/sedge-*/bin/sedge* --version
